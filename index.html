<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FutDeal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- Header: Logo -->
    <header class="app-header">
      <div class="logo">FUT<span>DEAL</span></div>
      <div class="header-sub">Online Draft Challenge</div>
    </header>

    <!-- Lobby Board -->
    <main id="lobby-board" class="board-section">
      <div class="lobby-container">
        <h2>Welcome to FutDeal</h2>
        
        <div class="input-group">
          <label for="player-name">Nickname</label>
          <input type="text" id="player-name" placeholder="Enter your nickname" maxlength="15" />
        </div>

        <div class="lobby-actions">
          <button id="btn-create-room" class="action-btn action-btn--keep">Create Room</button>
        </div>

        <div class="lobby-divider"><span>OR</span></div>

        <div class="input-group">
          <label for="room-code-input">Room Code</label>
          <input type="text" id="room-code-input" placeholder="e.g. ABCD" maxlength="4" style="text-transform: uppercase;" />
        </div>

        <div class="lobby-actions">
          <button id="btn-join-room" class="action-btn action-btn--ignore">Join Room</button>
        </div>

        <div id="lobby-status" class="lobby-status hidden">
          <div class="spinner"></div>
          <p id="lobby-status-text">Waiting for opponent...</p>
        </div>
        
        <div id="room-code-display" class="room-code-display hidden">
          <span>Room Code:</span>
          <strong id="display-code"></strong>
          <p class="small-text">Share this code with your opponent.</p>
        </div>
      </div>
    </main>

    <!-- Draft Board -->
    <main id="draft-board" class="board-section hidden">
      
      <!-- MATCH SCOREBOARD -->
      <div id="match-scoreboard" class="match-scoreboard">
        <!-- LEFT: YOU -->
        <div class="score-side score-left">
          <div class="score-name" id="score-you-name">YOU</div>
          <div class="score-ovr" id="score-you-ovr">--</div>
          <div class="score-dots" id="score-you-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
          </div>
        </div>
        
        <!-- CENTER: ROUND INFO -->
        <div class="score-center">
          <div class="score-round-label">DRAFTING</div>
          <div class="score-pos-label" id="score-current-pos">WAITING</div>
        </div>

        <!-- RIGHT: OPPONENT -->
        <div class="score-side score-right">
          <div class="score-name" id="score-opp-name">OPPONENT</div>
          <div class="score-ovr" id="score-opp-ovr">--</div>
          <div class="score-dots" id="score-opp-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
          </div>
        </div>
      </div>

      <div id="draft-area" class="draft-area" aria-label="Draft choices" aria-live="polite">
        <!-- Cards inserted by js -->
      </div>
      
      <div id="action-bar" class="action-bar" aria-label="Draft actions">
        <!-- Keep/Ignore buttons inserted by js -->
      </div>
      
      <!-- BOTTOM SQUAD DRAWER -->
      <button id="btn-toggle-squad" class="btn-toggle-squad-fab" aria-label="Toggle Squad">
        <i class="fa-solid fa-list-ul"></i>
      </button>

      <div id="squad-drawer" class="squad-drawer bottom-drawer drawer-closed" aria-hidden="true">
        <div class="drawer-content">
          <div class="drawer-handle"></div>
          <h3>Your Squad</h3>
          <div id="team-slots-top" class="team-slots-top">
            <!-- Slots inserted by js -->
          </div>
        </div>
      </div>
    </main>

    <!-- Match Board (Hidden by default) -->
    <main id="match-board" class="board-section hidden">
      <div class="match-teams-header">
        <div class="match-team match-team--player">
          <span class="match-team-label">You</span>
          <span id="match-player-avg" class="match-team-avg">--</span>
        </div>
        <div class="match-vs">VS</div>
        <div class="match-team match-team--opponent">
          <span class="match-team-label">Opponent</span>
          <span id="match-opponent-avg" class="match-team-avg" style="color:var(--slate)">--</span>
        </div>
      </div>

      <div id="match-h2h-list" class="match-h2h-list">
        <!-- H2H rows generated by js -->
      </div>

      <div class="tactic-hint">Pick a tactic to play</div>
      <div id="tactic-buttons-container" class="tactic-buttons" role="group" aria-label="Tactic selection">
        <!-- Tactic buttons generated by ui.js -->
      </div>
    </main>

    <!-- Result Board (Hidden by default) -->
    <main id="result-board" class="board-section hidden">
      <div class="result-screen-content">
        <div id="result-outcome" class="result-outcome"></div>

        <div class="result-score">
          <span id="result-score-player" class="result-score-you"></span>
          <span class="result-score-sep">–</span>
          <span id="result-score-opponent" class="result-score-opp"></span>
        </div>
        <div class="result-score-labels">
          <span>You</span><span></span><span>Opponent</span>
        </div>

        <div class="result-tactics">
          <div class="result-tactic-block">
            <span class="result-tactic-label">Your Tactic</span>
            <span id="result-player-tactic" class="result-tactic-name"></span>
            <span id="result-player-ovr" class="result-tactic-ovr"></span>
          </div>
          <div class="result-tactic-sep">vs</div>
          <div class="result-tactic-block">
            <span class="result-tactic-label">Their Tactic</span>
            <span id="result-opponent-tactic" class="result-tactic-name"></span>
            <span id="result-opponent-ovr" class="result-tactic-ovr"></span>
          </div>
        </div>

        <button id="btn-restart" class="action-btn action-btn--keep" style="margin-top:1.5rem; width: 100%;">
          <i class="fa-solid fa-rotate-right" style="margin-right: 6px;"></i> Draft Again
        </button>
      </div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
